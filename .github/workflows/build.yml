name: Build Pause & Pocket APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Pause_and_Pocket_2_0_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q Pause_and_Pocket_Native_Android_Project.zip -d source

      - name: Build debug APK
        run: gradle --no-daemon -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pause-pocket-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
